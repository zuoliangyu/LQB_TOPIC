name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 生成站点（按届 / 按赛道页面、侧边栏、首页总览）
        run: python3 scripts/build_site.py dist

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      # 同一份产物同步到 Netlify（主站）。Netlify 跑在根路径，用 _redirects 把 GitHub Pages
      # 的 /LQB_TOPIC/ 子路径重写到根下同名文件。
      - name: 发布到 Netlify
        run: |
          echo '/LQB_TOPIC/*  /:splat  200' >> dist/_redirects
          npx --yes netlify-cli@26 deploy --prod --no-build --dir=dist --message "${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
